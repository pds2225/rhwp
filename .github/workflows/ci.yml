name: CI

on:
  push:
    branches: [main, devel]
    tags: ['v*']
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify docs-only
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${PR_BASE}" ] && [ -n "${PR_HEAD}" ]; then
            FILES="$(git diff --name-only --diff-filter=ACMR "${PR_BASE}...${PR_HEAD}" || true)"
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            FILES="$(git diff --name-only --diff-filter=ACMR "${BEFORE_SHA}" "${GITHUB_SHA}" || true)"
          else
            FILES="$(git diff --name-only --diff-filter=ACMR HEAD~1 "${GITHUB_SHA}" 2>/dev/null || true)"
          fi
          docs_only=true
          while IFS= read -r f; do
            [ -z "${f}" ] && continue
            case "${f}" in
              TASK.md|*.md|docs|docs/*|.github/workflows|.github/workflows/*) ;;
              *) docs_only=false ;;
            esac
          done <<EOF
          ${FILES}
          EOF
          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
          echo "docs_only=${docs_only}"

      - name: Docs-only skip
        if: steps.classify.outputs.docs_only == 'true'
        run: echo "docs/workflow-only change; cargo tests skipped"

      - name: Install Rust toolchain
        if: steps.classify.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        if: steps.classify.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        if: steps.classify.outputs.docs_only != 'true'
        run: cargo build --verbose

      - name: Run tests
        if: steps.classify.outputs.docs_only != 'true'
        run: cargo test --verbose

      - name: Clippy
        if: steps.classify.outputs.docs_only != 'true'
        run: cargo clippy -- -D warnings

  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-

      - name: Build WASM
        run: wasm-pack build --target web --release

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rhwp-wasm-pkg
          path: pkg/
          retention-days: 30
